<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Flashcard từ vựng</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--f1:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--f0:'Be Vietnam Pro',system-ui,sans-serif;--bg:radial-gradient(520px 420px at 6% 4%,rgba(255,204,176,.75),transparent 65%),radial-gradient(560px 520px at 100% 32%,rgba(170,158,255,.5),transparent 65%),radial-gradient(540px 480px at 18% 100%,rgba(146,232,224,.55),transparent 65%),linear-gradient(160deg,#f8f1ea,#ece7f3 55%,#e4e9f5);--fg:#1e2235;--mu:#6c7389;--ok:#1f9e7e;--no:#d9475a;--ln:rgba(255,255,255,.92);--rl:rgba(110,110,160,.2);--sd:rgba(86,84,150,.32);--gl:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.34));--hl:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.5);--bl:blur(18px) saturate(140%);--btn:linear-gradient(180deg,#8888fc,#6464ef);--mint:linear-gradient(180deg,rgba(198,249,243,.96),rgba(158,230,224,.82));--iri:linear-gradient(135deg,#bcaeff,#8fe6ea,#ffc8e2,#ffd8b2,#bcaeff);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f1ebf2;color:var(--fg);font:400 16.5px/1.5 var(--f1)}
#app.store,#modal{font-family:var(--f0)}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
#bg i{position:absolute;bottom:-220px;border-radius:50%;border:2px solid rgba(255,255,255,.85);opacity:.85;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),rgba(255,255,255,.28) 38%,rgba(255,255,255,.06));box-shadow:inset 10px 10px 26px rgba(150,236,246,.5),inset -12px -12px 28px rgba(255,186,224,.5),inset 0 0 0 5px rgba(190,172,255,.18),0 24px 38px -12px rgba(110,100,220,.4);animation:rise linear infinite}
@keyframes rise{to{transform:translate(30px,-125vh)}}
#app{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100%);display:flex;flex-direction:column;max-width:680px;margin:0 auto;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);overflow:hidden}
html.kb #app{padding-bottom:0}
header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:6px 0}
header h2{margin:0;font-size:18px;font-weight:600}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:2px 0 10px;overflow:auto;overscroll-behavior:contain}
.body>.big{margin:0}.menu{justify-content:center;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.back,.sm,.chip{border:1px solid var(--ln);border-radius:99px;background:var(--gl);box-shadow:var(--hl),0 8px 14px -8px var(--sd);color:var(--fg)}
.back{padding:4px 14px;font-size:14px}.sm{padding:3px 12px;font-size:14px}
.hs{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;flex:none;padding-bottom:6px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs>*{flex:none}.hs .chip{box-shadow:var(--hl),0 5px 8px -5px var(--sd)}
#picked{flex:1 0 100%;font-size:14px;align-items:center}
h1{margin:0;text-align:center;font-size:clamp(34px,11vw,54px);font-weight:600;letter-spacing:-.01em}
.menu h1{background:linear-gradient(90deg,#4f4fe0,#2fb3aa);-webkit-background-clip:text;background-clip:text;color:transparent}
.mu{color:var(--mu)}.c{text-align:center}
.big{display:block;width:100%;margin:10px 0;padding:12px 16px;border:1px solid rgba(255,255,255,.6);border-radius:99px;background:var(--btn);color:#fff;font-size:17px;font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 8px rgba(60,60,200,.28),0 14px 22px -8px rgba(98,98,238,.65)}
.big:active{filter:brightness(.94);transform:translateY(1px)}
.big.alt{border-color:rgba(255,255,255,.95);background:var(--mint);color:#0f4d48;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 20px -9px rgba(60,180,170,.6)}
.big.glass{border:2px solid transparent;background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.55)) padding-box,var(--iri) border-box;color:var(--fg);box-shadow:0 12px 22px -10px var(--sd)}
.big.arm,.sm.arm{border-color:var(--no);background:var(--no);color:#fff;box-shadow:none}
.big.sm3{width:auto;margin:0;padding:6px 22px;font-size:15px}
.three,.row4{display:grid;gap:8px;flex:none}.three{grid-template-columns:repeat(3,1fr)}.row4{grid-template-columns:1fr 1.2fr .8fr 1fr}
.three .big,.row4 .big{margin:0;padding:10px 4px;font-size:15px}
.card{margin:6px 0;padding:12px 14px;border:1px solid var(--ln);border-radius:26px;background:var(--gl);box-shadow:var(--hl),0 18px 34px -14px var(--sd);-webkit-backdrop-filter:var(--bl);backdrop-filter:var(--bl)}
h3{margin:0 0 6px;font-size:17px;font-weight:600}
.chip{padding:2px 11px;font-size:15px}.chip small{opacity:.7}
.chip.done{border-color:rgba(31,158,126,.5);background:linear-gradient(160deg,rgba(208,250,236,.95),rgba(255,255,255,.45));color:var(--ok)}
.chip.on{border-color:rgba(255,255,255,.6);background:var(--btn);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 14px -6px rgba(98,98,238,.6)}
.chip.done.on{background:linear-gradient(180deg,#43d3aa,#1fae88);color:#fff}
.chips{flex:1;min-height:60px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px 6px;padding:2px 2px 8px;overflow:auto;overscroll-behavior:contain}
.srow{flex:none;display:flex;align-items:center;gap:8px}.srow input{flex:1;margin:0}.lg{font-size:12px;color:var(--mu);white-space:nowrap}
.k{display:inline-block;width:10px;height:10px;margin:0 3px 0 6px;border:1px solid var(--mu);border-radius:50%;vertical-align:-1px}.k.d{background:var(--ok);border-color:var(--ok)}
.pick{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}html.kb .pick{display:none}
.form{flex:none}.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}.wide{grid-column:1/-1}.sm2{margin-bottom:4px;font-size:13px}
label{display:block;font-size:12px;color:var(--mu)}
input,select,textarea{display:block;width:100%;margin:2px 0 0;padding:6px 12px;border:1px solid var(--ln);border-radius:16px;background:rgba(255,255,255,.84);box-shadow:inset 0 2px 5px rgba(86,84,150,.14),0 6px 12px -8px var(--sd);color:var(--fg);font:inherit;font-size:16px}
textarea{line-height:1.35;resize:none}
select option{color:#111}::placeholder{color:#9aa0b5}
.foot{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:34px}.foot .big{margin-left:auto}.foot .big+.big{margin-left:0}
.warn{flex:1;color:var(--no);font-size:13px;font-weight:500}.warn:empty{display:none}
.grow{flex:1;min-height:0;overflow:hidden}
.row{display:flex;align-items:center;gap:6px;height:50px;border-bottom:1px solid var(--rl)}
.rw{flex:1;min-width:0;cursor:pointer}.rw>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rw .mu{font-size:13px}.row i,.row small{color:var(--mu)}
.sm.dx{padding:3px 10px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 8px}.dl dt{color:var(--mu);font-size:14px}.dl dd{margin:0;word-break:break-word;white-space:pre-line}.dl .e{color:var(--mu)}
.pg{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mu)}
.bar{flex:none;height:8px;margin-top:6px;overflow:hidden;border:1px solid var(--ln);border-radius:99px;background:rgba(255,255,255,.6);box-shadow:inset 0 1px 3px rgba(86,84,150,.15)}.bar i{display:block;height:100%;background:var(--btn);transition:width .3s}
.num{font-size:30px;font-weight:600}
.card3d{position:relative;flex:1 1 auto;min-height:200px;max-height:400px;margin:4px 0;perspective:1200px;cursor:pointer}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s}.flip .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;overflow:auto;border:2px solid transparent;border-radius:34px;background:linear-gradient(160deg,rgba(224,216,255,.94),rgba(200,244,240,.9)) padding-box,var(--iri) border-box;box-shadow:0 24px 40px -16px var(--sd),inset 0 1px 0 rgba(255,255,255,.9);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.b{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(255,228,210,.94),rgba(226,220,255,.9)) padding-box,var(--iri) border-box}
.b p{margin:2px 0;align-self:stretch;text-align:left;white-space:pre-line}
.w{font-size:clamp(30px,9vw,50px);font-weight:500;line-height:1.1;word-break:break-word}.w2{margin:6px 0;font-size:24px;font-weight:500}
.end{padding-top:60px;text-align:center}
.pat{margin:8px 0;font:600 22px ui-monospace,monospace;letter-spacing:2px;word-break:break-all}
.ok{color:var(--ok);font-size:22px;font-weight:600}.bad{color:var(--no);font-size:22px;font-weight:600}.x{color:var(--no);text-decoration:underline wavy}.mk{font-size:21px}
.opt{display:flex;align-items:center;gap:12px;width:100%;margin:8px 0;padding:10px 14px;border:1px solid var(--ln);border-radius:22px;background:var(--gl);box-shadow:var(--hl),0 10px 18px -10px var(--sd);color:var(--fg);font-size:18px;text-align:left}
.opt:disabled{opacity:1;color:var(--fg)}.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--no)}
.bx{flex:none;display:grid;place-items:center;width:24px;height:24px;border:2px solid #b9b7d6;border-radius:8px;background:#fff;color:#fff;font:700 15px/1 sans-serif}.opt.ok .bx{border-color:var(--ok);background:var(--ok)}.opt.no .bx{border-color:var(--no);background:var(--no)}
.mask{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100%);z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(120,118,165,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:680px;max-height:100%;overflow:auto;padding:12px 12px 10px;border:1px solid #fff;border-radius:28px 28px 0 0;background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(240,236,253,.9));box-shadow:0 -14px 40px -12px var(--sd)}
html:not(.kb) .sheet{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;top:42%;z-index:40;max-width:86vw;padding:11px 24px;border:1px solid rgba(255,255,255,.7);border-radius:99px;background:var(--btn);color:#fff;font-size:18px;font-weight:500;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 14px 26px -8px rgba(98,98,238,.6)}
#toast.show{animation:pop .9s ease forwards}
@keyframes pop{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.in{transition:none}#bg i{animation:none}}
:root{--gl:linear-gradient(160deg,rgba(255,255,255,.46),rgba(255,255,255,.12));--ln:rgba(255,255,255,.75);--hl:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(255,255,255,.45),inset 0 0 16px rgba(255,255,255,.2);--bl:blur(22px) saturate(180%);--sd:rgba(45,65,110,.3);--btn:linear-gradient(180deg,rgba(132,132,252,.84),rgba(96,96,236,.76));--mint:linear-gradient(180deg,rgba(196,248,242,.66),rgba(150,228,222,.44))}

  $('#picked').innerHTML=a.length?'<span class="mu">Đã chọn:</span>'+a.join('')+'<button class="chip" data-a="clr">Bỏ hết</button>':'<span class="mu">Chưa chọn mục nào (học tất cả)</span>'}
}
const ROW=50;let pg=0,pend=null;
const rf=()=>scr=='store'?list():render();
function list(){
 const q=sq.trim().toLowerCase();let r=sorted;
 if(q){const f=x=>x.w.toLowerCase().startsWith(q);r=sorted.filter(x=>x.w.toLowerCase().includes(q)||x.m.toLowerCase().includes(q));r=r.filter(f).concat(r.filter(x=>!f(x)))}
 const el=$('#list'),n=Math.max(1,Math.floor(el.clientHeight/ROW)),pc=Math.max(1,Math.ceil(r.length/n));pg=Math.min(pg,pc-1);
 el.innerHTML=r.slice(pg*n,pg*n+n).map(x=>`<div class="row"><div class="rw" data-a="view" data-i="${x.id}"><div><b>${E(x.w)}</b> <i>${pl(x.p)}</i> <small>${lvl(x)}</small></div><div class="mu">${E(x.m)||'&nbsp;'}</div></div><button class="sm" data-a="edit" data-i="${x.id}">Sửa</button><button class="sm dx${pend==x.id?' arm':''}" data-a="dl" data-i="${x.id}">${pend==x.id?'✓':'✕'}</button></div>`).join('')||'<p class="mu">Không tìm thấy từ nào.</p>';
 $('#pi').textContent=r.length?`${pg+1} / ${pc} · ${r.length} từ`:'0 từ';
}
function del(i){const x=byId[i];if(!x)return;words.splice(words.indexOf(x),1);delete byId[i];if(typeof x.id=='number')st.x[x.id]=1;else st.u=st.u.filter(o=>o!==x);deck=deck.filter(y=>y!==x);sv();idx()}
const prog=()=>`<div class="bar"><i style="width:${di/deck.length*100}%"></i></div><p class="mu c">${di+1} / ${deck.length}${scr!='cards'?' · Đúng '+sc:''}</p>`;
const end=(t,b)=>`<main class="end"><h1>✓</h1><p>${t}</p><button class="big" data-a="again">${b}</button></main>`;
function mk(x){const o=[];shuf(words.filter(y=>y.m&&kk(y.m)!=kk(x.m))).forEach(y=>{if(o.length<3&&!o.some(z=>kk(z)==kk(y.m)))o.push(y.m)});const a=shuf(o.concat(x.m));return{o:a,c:a.indexOf(x.m)}}
const V={
menu:()=>`<h1>Flashcard</h1><p class="mu c">Từ vựng tiếng Anh · A1 – C1 · ${words.length} từ</p><button class="big" data-a="go" data-i="study">Học thẻ</button><button class="big alt" data-a="go" data-i="create">Tạo thẻ</button><button class="big glass" data-a="go" data-i="stats">Tổng kết</button>`,
study:()=>`<div class="hs" id="lv"></div><div class="srow"><input id="tq" placeholder="Tìm chủ đề…" autocomplete="off"><span class="lg"><i class="k"></i>chưa học<i class="k d"></i>đã học</span></div><div class="chips" id="chips"></div><div class="hs" id="pos"></div><button class="big" id="ok" data-a="ok">Oke</button><div class="three"><button class="big alt" data-a="sp">Chính tả</button><button class="big alt" data-a="qz">Trắc nghiệm</button><button class="big alt" data-a="go" data-i="store">Kho từ</button></div>`,
create:()=>`<div class="pick"><div class="hs" id="lv"></div><div class="srow"><input id="tq" placeholder="Tìm / nhập chủ đề mới · giữ chủ đề để xóa" autocomplete="off"></div><div class="chips" id="chips"></div></div><div class="form"><div class="mu sm2" id="dest"></div><div class="g2"><label>Từ vựng *<input id="fw" autocomplete="off" autocapitalize="off"></label><label>Từ loại<select id="fp">${posOpt('')}</select></label><label>Nghĩa *<input id="fm" autocomplete="off"></label><label>Note<input id="fn" autocomplete="off"></label><label>Đồng nghĩa<input id="fs" autocomplete="off"></label><label>Trái nghĩa<input id="fa" autocomplete="off"></label></div><div class="foot"><div class="warn" id="dw"></div><button class="big sm3" data-a="save">Lưu</button></div></div>`,
store:()=>`<input id="sq" placeholder="Tra từ như từ điển…" autocomplete="off"><div class="grow" id="list"></div><div class="pg"><button class="sm" data-a="pp">‹</button><span id="pi"></span><button class="sm" data-a="pnx">›</button></div>`,
stats:()=>{const R=stat(),N=words.length,row=(l,n)=>`<section class="card"><h3>${l}</h3><p><b class="num">${n}</b> từ <span class="mu">· chiếm ${(n/N*100).toFixed(1)}% trong ${N} từ vựng</span></p><div class="bar"><i style="width:${Math.min(100,n/N*100)}%"></i></div></section>`;
 return row('Hôm nay',R.d.size)+row('Tuần này (từ thứ Hai)',R.w.size)+row('Tháng này',R.m.size)+row('Tổng cộng từ trước đến nay',Object.keys(st.s).filter(i=>byId[i]).length)},
cards:()=>{if(di>=deck.length)return end(`Hết bộ thẻ (${deck.length} từ)`,'Xáo trộn và học lại');
 const x=deck[di];
 return `${prog()}<div class="card3d${fl?' flip':''}" data-a="flip"><div class="in"><div class="f"><div class="w">${E(x.w)}</div><div class="mu">${pl(x.p)} ${PV[x.p]||''}</div><small class="mu">${lvl(x)}</small><small class="mu"${st.s[x.id]?' style="color:var(--ok);font-weight:600"':''}>${st.s[x.id]?'✓ Đã thuộc':'Chưa thuộc'}</small></div><div class="b">${x.m?`<div class="w2">${E(x.m)}</div>`:'<div class="mu">Chưa có nghĩa. Bấm “Sửa” để thêm.</div>'}${x.n?`<p><b>Note:</b>\n${E(fmtN(x.n))}</p>`:''}${x.s?`<p><b>Đồng nghĩa:</b> ${E(x.s)}</p>`:''}${x.a?`<p><b>Trái nghĩa:</b> ${E(x.a)}</p>`:''}</div></div></div><div class="two"><button class="big alt rd" data-a="nk">✗ Chưa thuộc</button><button class="big alt gr" data-a="yk">✓ Đã thuộc</button></div><div class="row4"><button class="big alt" data-a="prev">‹</button><button class="big alt" data-a="edit" data-i="${x.id}">Sửa</button><button class="big alt dx${pend==x.id?' arm':''}" data-a="dl" data-i="${x.id}">${pend==x.id?'✓':'✕'}</button><button class="big" data-a="next">›</button></div>`},
spell:()=>{if(di>=deck.length)return end(`Đúng ${sc}/${deck.length} từ`,'Làm lại');
 const x=deck[di],a=ans,e=kk(x.w),u=a?kk(a.v):'';
 return `${prog()}<section class="card c"><div class="mu">${pl(x.p)} ${PV[x.p]||''}</div><div class="w2">${E(x.m)}</div><div class="pat">${[...x.w].map(c=>/\w/.test(c)?'_':c==' '?'\u00a0':c).join(' ')}</div><input id="ans" placeholder="Gõ từ vựng…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"${a?` value="${E(a.v)}" disabled`:''}>${a?(a.ok?'<div class="ok">✓ Đúng!</div>':`<div class="bad">✗ Sai</div><p>Bạn viết: <span class="mk">${u?[...u].map((c,i)=>c==e[i]?E(c):`<b class="x">${E(c)}</b>`).join('')+(u.length<e.length?'<b class="x">…</b>':''):'(để trống)'}</span></p><p>Đáp án: <b>${E(x.w)}</b></p>`)+'<button class="big" data-a="sn">Tiếp ›</button>':'<button class="big" data-a="chk">Kiểm tra</button>'}</section>`},
quiz:()=>{if(di>=deck.length)return end(`Đúng ${sc}/${deck.length} câu`,'Làm lại');
 const x=deck[di];if(!qo)qo=mk(x);const d=ans!=null;
 return `${prog()}<section class="card c"><div class="mu">${pl(x.p)} ${PV[x.p]||''}</div><div class="w">${E(x.w)}</div><p class="mu">Chọn nghĩa đúng</p>${qo.o.map((m,i)=>`<button class="opt${d?(i==qo.c?' ok':i==ans?' no':''):''}" data-a="pk" data-i="${i}"${d?' disabled':''}><span class="bx">${d?(i==qo.c?'✓':i==ans?'✗':''):''}</span><span>${E(m)}</span></button>`).join('')}${d&&ans!=qo.c?'<button class="big" data-a="qn">Tiếp tục</button>':''}</section>`}
};
function render(){
 $('#app').className=scr;$('#app').innerHTML=(scr=='menu'?'':`<header><h2>${TTL[scr]}</h2>${scr=='study'?'<div id="picked" class="hs"></div>':''}</header>`)+`<div class="body ${scr}">${V[scr]()}</div>`+(scr=='menu'?'':'<footer><button class="back" data-a="back">‹ Quay lại</button></footer>');
 if(scr=='study'||scr=='create')sel();
 if(scr=='store')list();
 if(scr=='create')$('#fp').value=C.p;
 if(scr=='spell'&&!ans&&di<deck.length)$('#ans').focus();
}
function nav(s){scr=s;tq='';sq='';pg=0;pend=null;if(s=='menu'){S.lv.clear();S.tp.clear();S.ps.clear();C={lv:'A1',tp:-1,p:''};deck=[];di=fl=sc=0;ans=qo=null;lim=60}render()}
const back=()=>{if($('#modal').innerHTML)$('#modal').innerHTML='';else if(scr!='menu')nav(PAR[scr])};
function start(m){let p=pick();if(m!='c')p=p.filter(x=>x.m);
 if(!p.length){toast(m=='c'?'Chưa có từ nào phù hợp':'Chưa có từ nào có nghĩa trong mục đã chọn. Hãy thêm nghĩa bằng nút Sửa.',2.4);return}
 if(m=='q'&&new Set(words.filter(x=>x.m).map(x=>kk(x.m))).size<4){toast('Cần ít nhất 4 nghĩa khác nhau trong kho từ.',2.4);return}
 deck=shuf(p);di=0;fl=0;sc=0;ans=null;qo=null;scr={c:'cards',s:'spell',q:'quiz'}[m];render();scrollTo(0,0)}
function chk(){const v=$('#ans').value,ok=kk(v)==kk(deck[di].w);if(ok)sc++;mark(deck[di]);ans={v,ok};render()}
const qnext=()=>{di++;ans=null;qo=null;render()};
function pk(i){if(ans!=null)return;ans=+i;mark(deck[di]);if(ans==qo.c){sc++;const n=di;setTimeout(()=>{if(scr=='quiz'&&di==n&&ans!=null)qnext()},800)}render()}
function dup(){const w=$('#fw').value,p=$('#fp').value,d=dupes(w);$('#dw').textContent=!d.length?'':d.some(x=>x.p==p)?dm(w.trim(),p,d):'ℹ Đã có từ này với từ loại khác: '+d.map(x=>pl(x.p)||'—').join(' ')}
function add(){
 const g=k=>$('#'+k).value.trim(),w=g('fw'),m=g('fm'),p=$('#fp').value,er=$('#dw');
 if(!w||!m){er.textContent='⚠ Phải điền Từ vựng và Nghĩa trước khi lưu.';$(w?'#fm':'#fw').focus();return}
 const d=dupes(w).filter(x=>x.p==p);
 if(d.length){er.textContent=dm(w,p,d);return}
 er.textContent='';
 const o={id:'u'+Date.now(),w,p,m,n:g('fn'),s:g('fs'),a:g('fa'),t:[C.tp>=0?C.tp:topic(C.lv,'Từ của tôi')]};
 words.push(o);byId[o.id]=o;st.u.push(o);sv();idx();
 ['fw','fm','fn','fs','fa'].forEach(k=>$('#'+k).value='');$('#dw').textContent='';sel();toast('Đã lưu ✓');$('#fw').focus();
}
function edit(i){const x=byId[i];$('#modal').innerHTML=`<div class="mask"><div class="sheet"><div class="g2"><label>Từ vựng<input id="ew" value="${E(x.w)}"></label><label>Từ loại<select id="ep">${posOpt(x.p)}</select></label><label class="wide">Nghĩa<input id="em" value="${E(x.m)}"></label><label>Đồng nghĩa<input id="es" value="${E(x.s)}"></label><label>Trái nghĩa<input id="ea" value="${E(x.a)}"></label><label class="wide">Note · tối đa 5 câu, mỗi dòng 1 câu<textarea id="en" rows="${Math.max(2,Math.min(5,fmtN(x.n).split('\n').length))}" autocomplete="off" spellcheck="false">${E(fmtN(x.n))}</textarea></label></div><div class="foot"><div class="warn" id="ee"></div><button class="big alt sm3" data-a="ecan">Hủy</button><button class="big sm3" data-a="esv" data-i="${x.id}">Lưu</button></div></div></div>`}
const fmtN=s=>(s||'').split('\n').map(l=>l.replace(/^[\s\-–•]+/,'').trim()).filter(Boolean).slice(0,5).map(l=>'- '+l).join('\n');
function view(i){const x=byId[i],f=(l,v)=>`<dt>${l}</dt><dd${v?'':' class="e"'}>${v?E(v):'—'}</dd>`;$('#modal').innerHTML=`<div class="mask" data-a="mk"><div class="sheet"><dl class="dl">${f('Chủ đề',x.t.map(i=>T[i][1]+' · '+T[i][0]).join(', '))}${f('Từ vựng',x.w)}${f('Từ loại',x.p?pl(x.p)+' '+(PV[x.p]||''):'')}${f('Nghĩa',x.m)}${f('Ghi chú',fmtN(x.n))}${f('Đồng nghĩa',x.s)}${f('Trái nghĩa',x.a)}</dl><div class="foot"><button class="big alt sm3" data-a="ecan">Đóng</button></div></div></div>`}
function esv(i){
 const x=byId[i],g=k=>$('#'+k).value.trim(),w=g('ew'),p=$('#ep').value;

 Object.assign(x,{w,p,m:g('em'),n:fmtN($('#en').value),s:g('es'),a:g('ea')});

document.addEventListener('click',e=>{

 if(a=='go')nav(i);
 else if(a=='dl'){const x=byId[i];ask('Chắc chắn xóa?','Từ “'+E(x.w)+'” sẽ bị xóa khỏi kho từ.',()=>{del(i);fl=0;rf()})}
 else if(a=='pp'){if(pg>0){pg--;list()}}
 else if(a=='pnx'){pg++;list()}
 else if(a=='back')back();
 else if(a=='lv'){if(c){C.lv=i;if(C.tp>=0&&T[C.tp][0]!=i)C.tp=-1}else{tog(S.lv,i);S.tp.forEach(k=>{if(!S.lv.has(T[k][0]))S.tp.delete(k)})}sel()}

 else if(a=='rm'){S[t.dataset.k].delete(t.dataset.k=='tp'?+i:i);S.tp.forEach(k=>{if(!S.lv.has(T[k][0]))S.tp.delete(k)});sel()}
 else if(a=='clr'){S.lv.clear();S.tp.clear();S.ps.clear();sel()}
 else if(a=='ntp'){C.tp=topic(C.lv,tq.trim());tq='';$('#tq').value='';sel()}
 else if(a=='ok')start('c');
 else if(a=='sp')start('s');
 else if(a=='qz')start('q');
 else if(a=='save')add();
 else if(a=='more'){lim+=60;list()}
 else if(a=='edit')edit(i);
 else if(a=='esv')esv(i);
 else if(a=='ecan')$('#modal').innerHTML='';
 else if(a=='view')view(i);
 else if(a=='mk'){if(e.target===t)$('#modal').innerHTML=''}
 else if(a=='flip'){fl^=1;t.classList.toggle('flip')}
 else if(a=='next'){di++;fl=0;render()}
 else if(a=='prev'){if(di>0){di--;fl=0;render()}}
 else if(a=='yk'){mark(deck[di]);di++;fl=0;render()}else if(a=='nk'){unk(deck[di]);di++;fl=0;render()}else if(a=='cfy'){const f=cf;cf=null;$('#modal').innerHTML='';f&&f()}else if(a=='again'){deck=shuf(deck);di=0;fl=0;sc=0;ans=null;qo=null;render()}
 else if(a=='chk')chk();
 else if(a=='sn')qnext();
 else if(a=='pk')pk(i);
 else if(a=='qn')qnext();
});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{
 const k=e.target.id;
 if(k=='tq'){tq=e.target.value;sel()}
 else if(k=='sq'){sq=e.target.value;pg=0;pend=null;list()}
 else if(k=='en')nz(e.target);
 else if(k=='fw')dup();
 else if(k=='fp'){C.p=e.target.value;sel();dup()}
}));
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&scr=='spell'&&e.target.tagName!='BUTTON'&&di<deck.length){if(ans)qnext();else chk()}});
const vv=window.visualViewport,R=document.documentElement;
function fit(){R.style.setProperty('--vh',(vv?vv.height:innerHeight)+'px');R.style.setProperty('--vt',(vv?vv.offsetTop:0)+'px');if(scr=='store')list()}
if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
addEventListener('resize',fit);fit();
const inF=e=>e&&e.closest&&e.closest('.form,.sheet');
document.addEventListener('focusin',e=>{if(matchMedia('(pointer:coarse)').matches&&inF(e.target))R.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!inF(document.activeElement))R.classList.remove('kb')},80));
let ex=null;
addEventListener('touchstart',e=>{const t=e.touches[0],w=innerWidth,d=Math.min(t.clientX,w-t.clientX);ex=d>=36&&d<=100&&!e.target.closest('.hs')?{l:t.clientX<w/2,x:t.clientX,y:t.clientY}:null},{passive:true});
addEventListener('touchend',e=>{if(!ex)return;const t=e.changedTouches[0],dx=t.clientX-ex.x;if((ex.l?dx>70:dx<-70)&&Math.abs(t.clientY-ex.y)<90)back();ex=null},{passive:true});
for(let i=0;i<8;i++){const s=40+Math.random()*120,b=document.createElement('i');b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${24+Math.random()*26}s;animation-delay:-${Math.random()*40}s`;$('#bg').append(b)}
const nz=t=>{const l=t.value.split('\n').slice(0,5).map(s=>/^- /.test(s)?s:'- '+s.replace(/^[\s\-–•]*/,'')),v=l.join('\n');if(v!==t.value){t.value=v;t.setSelectionRange(v.length,v.length)}t.rows=Math.max(2,Math.min(5,l.length))};
document.addEventListener('beforeinput',e=>{const t=e.target;if(t.id!='en')return;const v=t.value,s=t.selectionStart,n=t.selectionEnd,ls=v.lastIndexOf('\n',s-1)+1;
 if(e.inputType=='insertLineBreak'||e.inputType=='insertParagraph'){e.preventDefault();const le=v.indexOf('\n',n),rest=v.slice(n,le<0?v.length:le);if(v.slice(ls,s)=='- '&&!rest)return;if(v.split('\n').length>=5){toast('Tối đa 5 câu',1.4);return}t.setRangeText('\n- ',s,n,'end');nz(t)}
 else if(e.inputType=='deleteContentBackward'&&s==n&&s-ls==2&&v.slice(ls,s)=='- '){e.preventDefault();if(ls>0){t.setRangeText('',ls-1,s,'end');nz(t)}}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.id=='en'&&!t.value){t.value='- ';t.setSelectionRange(2,2)}});
render();
